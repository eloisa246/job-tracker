<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tracker backup and restore</title><style>body{background:#0c1320;color:#e5eaf4;font:16px system-ui;max-width:800px;margin:40px auto;padding:20px}button,a{padding:12px;margin:6px;border-radius:10px}button{cursor:pointer}textarea{width:100%;height:240px;background:#131e30;color:white}#message{white-space:pre-wrap}</style><h1>Tracker backup and restore</h1><p>Back up this device before replacing anything. This page never reads passwords or tokens.</p><button id="export">Show this device's backup</button><button id="download" disabled>Download backup</button><button id="preview">Check shared snapshot</button><button id="restore" disabled>Use shared snapshot on this device</button><p id="message" role="status"></p><textarea id="data" aria-label="Tracker backup JSON" readonly></textarea><p><a href="/">Return to tracker</a></p><script>
const KEY='eloisa-jobs-v4',STAMP='eloisa-job-tracker-local-updated-at';
const message=document.getElementById('message'),out=document.getElementById('data');
let snapshot=null,shared=null;
function counts(jobs){return jobs.length+' jobs | '+Object.entries(jobs.reduce((a,j)=>(a[j.status]=(a[j.status]||0)+1,a),{})).map(([k,v])=>k+': '+v).join(' | ')}
function valid(jobs){if(!Array.isArray(jobs)||!jobs.length||jobs.some(j=>!j||j.id==null||!j.title)||new Set(jobs.map(j=>String(j.id))).size!==jobs.length)throw Error('Invalid or empty job data. Nothing changed.');return jobs}
function showError(e){message.textContent=e.message}
document.getElementById('export').onclick=()=>{try{const jobs=valid(JSON.parse(localStorage.getItem(KEY)||'[]'));snapshot={version:1,completeSnapshot:true,updatedAt:new Date().toISOString(),jobs:Object.fromEntries(jobs.map(j=>[String(j.id),j])),deletedIds:[]};out.value=JSON.stringify(snapshot,null,2);message.textContent='This device: '+counts(jobs)+'. Backup ready; no data changed.';document.getElementById('download').disabled=false}catch(e){showError(e)}};
document.getElementById('download').onclick=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(snapshot,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='job-tracker-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};
document.getElementById('preview').onclick=async()=>{try{const r=await fetch('https://raw.githubusercontent.com/eloisa246/job-tracker/main/data/jobs-sync.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Cannot read shared snapshot.');shared=await r.json();if(!shared.completeSnapshot)throw Error('Shared file is not a complete snapshot yet. Nothing changed.');const jobs=valid(Object.values(shared.jobs));message.textContent='Shared snapshot '+shared.updatedAt+': '+counts(jobs);document.getElementById('restore').disabled=false}catch(e){showError(e)}};
document.getElementById('restore').onclick=()=>{try{const jobs=valid(Object.values(shared.jobs));if(!confirm('Replace this device with the shared snapshot? A backup of this device will be retained.'))return;localStorage.setItem('eloisa-jobs-before-restore-'+Date.now(),JSON.stringify({jobs:localStorage.getItem(KEY),updatedAt:localStorage.getItem(STAMP)}));localStorage.setItem(KEY,JSON.stringify(jobs));localStorage.setItem(STAMP,shared.updatedAt);message.textContent='Restored '+counts(jobs)+'. Return to the tracker. Your previous device data is backed up.'}catch(e){showError(e)}};
</script></html>
